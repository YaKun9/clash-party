name: Prepare IP Purity Beta 4
on:
  push:
    branches: [feature/ip-purity]
    paths: ['.github/workflows/prepare-ip-purity-beta4.yml']
permissions:
  contents: read
jobs:
  implement:
    if: github.repository == 'YaKun9/clash-party'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Integrate reviewed source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from textwrap import dedent

          def replace(path, before, after):
              p = Path(path)
              text = p.read_text()
              if text.count(before) != 1:
                  raise RuntimeError(f'Expected exactly one edit in {path}: {before[:80]}')
              p.write_text(text.replace(before, after, 1))

          p = Path('src/main/core/ipPurity.ts')
          text = p.read_text()
          text = text.replace("import axios from 'axios'", "import axios from 'axios'\nimport { queryPuritySources } from './ipPurityProviders'\nimport { explainPurityScore, IP_PURITY_SCORE_VERSION } from '../../shared/ipPurityScore'")
          a = text.index("const PROXYCHECK_API =")
          b = text.index('interface CheckContext', a)
          text = text[:a] + text[b:]
          a = text.index('function buildScamalyticsUrl(')
          b = text.index('async function discoverExitIp(', a)
          text = text[:a] + text[b:]
          a = text.index('async function performProviderQuery(')
          b = text.index('type BatchLookups', a)
          text = text[:a] + dedent('''
          async function performProviderQuery(ip: string, ctx: CheckContext): Promise<IpPurityRecord> {
            const details = await queryPuritySources(ip, ctx.config)
            const explanation = explainPurityScore(details)
            if (explanation.score === undefined) {
              throw new Error('No IP purity provider returned a valid score: unsupported response or unavailable service')
            }
            return {
              ip,
              sourceKey: ctx.sourceKey,
              checkedAt: Date.now(),
              score: explanation.score,
              ...details
            }
          }

          ''').lstrip('\n') + text[b:]
          old = "        config.ipPurityScamalyticsApiKey ?? ''\n"
          assert text.count(old) == 1
          text = text.replace(old, "        config.ipPurityScamalyticsApiKey ?? '',\n        config.ipPurityAbuseIPDBApiKey ?? '',\n        config.ipPurityIpapiApiKey ?? '',\n        IP_PURITY_SCORE_VERSION\n")
          old = '    proxycheck: entry.proxycheck\n'
          assert text.count(old) == 1
          text = text.replace(old, '    proxycheck: entry.proxycheck,\n    abuseipdb: entry.abuseipdb,\n    ipapi: entry.ipapi,\n    sourceStatus: entry.sourceStatus\n')
          p.write_text(text)

          p = Path('src/main/core/ipPurityCache.ts')
          text = p.read_text().replace("import { atomicWriteFile, WriteQueue } from '../utils/safeFile'", "import { atomicWriteFile, WriteQueue } from '../utils/safeFile'\nimport { sanitizePurityDetails } from '../../shared/ipPurityScore'")
          text = text.replace('export interface IpPurityRecord {', 'export interface IpPurityRecord extends IpPurityDetails {')
          a = text.index('  if (object(value.scamalytics)')
          b = text.index('\n}\n', a)
          text = text[:a] + "  const details = sanitizePurityDetails(value)\n  return details.scamalytics || details.proxycheck || details.abuseipdb || details.ipapi\n    ? { ...result, ...details }\n    : undefined" + text[b:]
          old = '      proxycheck: entry.proxycheck\n'
          assert text.count(old) == 1
          text = text.replace(old, '      proxycheck: entry.proxycheck,\n      abuseipdb: entry.abuseipdb,\n      ipapi: entry.ipapi,\n      sourceStatus: entry.sourceStatus\n')
          p.write_text(text)

          p = Path('src/renderer/src/components/proxies/proxy-item.tsx')
          text = p.read_text().replace("import { Button, Card, CardBody, Tooltip } from '@heroui/react'", "import { Button, Card, CardBody, Tooltip } from '@heroui/react'\nimport PurityDetails from './purity-details'")
          a = text.index('  const purityTooltip = useMemo(')
          b = text.index('  const purityButton =', a)
          text = text[:a] + text[b:]
          old = '<Tooltip content={<span className="whitespace-pre-line text-sm">{purityTooltip}</span>}>'
          assert text.count(old) == 1
          text = text.replace(old, '''<Tooltip
                  delay={250}
                  closeDelay={180}
                  offset={10}
                  placement="top"
                  classNames={{ content: 'p-0 rounded-2xl border border-divider bg-content1 shadow-2xl' }}
                  content={purity && purity !== 'timeout' ? <PurityDetails result={purity} /> : <div className="p-3 text-sm">{purity === 'timeout' ? `${t('proxies.delay.timeout')} · ` : ''}{t('proxies.purity.clickToCheck')}</div>}
                >''')
          p.write_text(text)
          replace('src/renderer/src/components/settings/mihomo-config.tsx',
                  "import SettingCard from '../base/base-setting-card'",
                  "import SettingCard from '../base/base-setting-card'\nimport PurityProviderSettings from './purity-provider-settings'")
          replace('src/renderer/src/components/settings/mihomo-config.tsx',
                  "      <SettingItem title={t('mihomo.ipPurity.scamalyticsEndpoint')} divider>",
                  "      <PurityProviderSettings />\n      <SettingItem title={t('mihomo.ipPurity.scamalyticsEndpoint')} divider>")
          replace('src/main/core/ipPurityProviders.ts',
                  'purityNumber, purityObject, purityScore, sanitizePurityDetails',
                  'purityNumber, purityObject, sanitizePurityDetails')

          # Preserve the genuine zero-score regression using a compromised host,
          # and test proxy-label-only normalization separately in the scoring suite.
          replace('src/main/core/ipPurity.test.ts',
                  "it('preserves a real zero purity result when the provider reports risk 100'",
                  "it('preserves a real zero purity result for a risk-100 compromised host'")
          replace('src/main/core/ipPurity.test.ts',
                  'detections: { risk: 100, proxy: true }',
                  'detections: { risk: 100, proxy: true, compromised: true }')
          replace('src/main/core/ipPurity.test.ts',
                  "await expect(mihomoProxyPurity('Singapore')).rejects.toThrow('offline')",
                  "await expect(mihomoProxyPurity('Singapore')).rejects.toThrow('No IP purity provider')")

          translations = {
            'title': ['IP 信誉详情', 'IP reputation details', 'IP 信譽詳情'],
            'experimental': ['实验性评分', 'Experimental score', '實驗性評分'],
            'low': ['低风险参考', 'Low reference risk', '低風險參考'],
            'medium': ['需留意风险', 'Review the evidence', '需留意風險'],
            'high': ['较高风险参考', 'Elevated reference risk', '較高風險參考'],
            'limited': ['有限数据 · 仅供参考', 'Limited evidence', '有限資料 · 僅供參考'],
            'higherBetter': ['综合分越高，模型估计风险越低。', 'Higher scores mean lower estimated risk.', '綜合分越高，模型估計風險越低。'],
            'sources': ['有效来源', 'Sources', '有效來源'],
            'coverage': ['覆盖权重', 'Weight coverage', '涵蓋權重'],
            'yes': ['是', 'Yes', '是'], 'no': ['否', 'No', '否'], 'unknown': ['未知', 'Unknown', '未知'],
            'network': ['出口与网络信息', 'Exit and network', '出口與網路資訊'],
            'location': ['位置', 'Location', '位置'], 'type': ['网络类型', 'Type', '網路類型'],
            'evidence': ['来源明细与计分', 'Evidence and contributions', '來源明細與計分'],
            'rawRisk': ['原始风险：越低越好', 'Raw risk: lower is better', '原始風險：越低越好'],
            'attributes': ['属性检测', 'Attributes', '屬性檢測'],
            'adjustedRisk': ['折算风险', 'Adjusted risk', '折算風險'],
            'localRisk': ['本地信号分', 'Local signal score', '本地訊號分'],
            'weight': ['实际权重', 'Weight', '實際權重'],
            'deduction': ['扣分', 'Deduction', '扣分'],
            'reports': ['举报', 'Reports', '舉報'], 'reporters': ['举报者', 'Reporters', '舉報者'],
            'days': ['天', 'd', '天'], 'lastReport': ['最近举报', 'Last reported', '最近舉報'],
            'hosting': ['机房', 'Hosting', '機房'], 'compromised': ['受控风险', 'Compromised', '受控風險'],
            'abuser': ['滥用标记', 'Abuse flag', '濫用標記'],
            'metadataOnly': ['仅有基础资料，不参与评分。', 'Metadata only; excluded from scoring.', '僅有基本資料，不參與評分。'],
            'limitedNote': ['缺少直接滥用数据，不能凭代理属性证明安全。', 'No direct abuse evidence available; proxy attributes cannot establish safety.', '缺少直接濫用資料，不能憑代理屬性證明安全。'],
            'disagreement': ['来源结果存在明显分歧，请查看原始指标。', 'Sources disagree. Inspect their original indicators.', '來源結果存在明顯分歧，請查看原始指標。'],
            'guard': ['严重信号保护：最低风险', 'Severe-signal risk floor', '嚴重訊號保護：最低風險'],
            'checkedAt': ['检测于', 'Checked', '檢測於'],
            'localCache': ['本地缓存', 'Local cache', '本機快取'],
            'disclaimer': ['VPN / Proxy / 机房不等于有滥用记录。权重是客户端经验规则，不是安全概率；覆盖率不是准确率。', 'VPN / Proxy / Hosting is not proof of abuse. Weights are client heuristics, not safety probabilities. Coverage is not accuracy.', 'VPN / Proxy / 機房不等於有濫用紀錄。權重是用戶端經驗規則，不是安全機率；涵蓋率不是準確率。'],
            'refreshHint': ['恢复的是上次确认的出口。点击节点分数重新检测。', 'Restores the last confirmed exit. Click the node score to refresh.', '還原的是上次確認的出口。點擊節點分數重新檢測。'],
            'keyHint': ['填写后启用；留空不请求该服务', 'Enter a key to enable; empty disables this source', '填寫後啟用；留空不請求此服務'],
            'saveFailed': ['API 配置保存失败，请重试', 'Unable to save API settings', 'API 設定儲存失敗，請重試'],
            'status.ok': ['已返回', 'Available', '已回傳'],
            'status.unconfigured': ['未配置', 'Not configured', '未設定'],
            'status.timeout': ['超时', 'Timeout', '逾時'],
            'status.rate_limited': ['额度或频率受限', 'Rate / quota limited', '額度或頻率受限'],
            'status.unauthorized': ['凭据无效或被拒绝', 'Key rejected', '憑證無效或遭拒'],
            'status.invalid': ['无有效数据', 'No valid data', '無有效資料'],
            'status.error': ['请求失败', 'Request failed', '請求失敗']
          }
          locales = Path('src/renderer/src/locales')
          for p in locales.glob('*.json'):
              data = json.loads(p.read_text())
              index = 0 if p.name == 'zh-CN.json' else 2 if p.name == 'zh-TW.json' else 1
              data.update({f'proxies.purity.details.{key}': values[index] for key, values in translations.items()})
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          Path('src/main/core/ipPurityExtendedCache.test.ts').write_text(dedent('''
          import { mkdtemp, readFile, rm } from 'fs/promises'
          import { tmpdir } from 'os'
          import { join } from 'path'
          import { expect, it } from 'vitest'
          import { IpPurityCache } from './ipPurityCache'

          it('restores all four sources and safe statuses after a new cache instance loads', async () => {
            const dir = await mkdtemp(join(tmpdir(), 'purity-four-source-'))
            try {
              const file = () => join(dir, 'cache.json')
              const first = new IpPurityCache(file)
              await first.load()
              const sourceKey = 'a'.repeat(64)
              first.setIp({
                ip: '203.0.113.1', sourceKey, score: 95, checkedAt: Date.now(),
                abuseipdb: { abuseConfidenceScore: 0, totalReports: 0, maxAgeInDays: 90 },
                ipapi: { isAbuser: false, isVpn: true, asn: 64500, country: 'Test' },
                proxycheck: { riskScore: 50, vpn: true },
                sourceStatus: { abuseipdb: 'ok', ipapi: 'ok', proxycheck: 'ok', scamalytics: 'unconfigured' }
              })
              first.remember('profile', 'Node', '203.0.113.1')
              await first.save()
              const second = new IpPurityCache(file)
              await second.load()
              const result = second.result('profile', 'Node', sourceKey, 86400000)
              expect(result?.abuseipdb?.totalReports).toBe(0)
              expect(result?.ipapi?.asn).toBe(64500)
              expect(result?.sourceStatus?.scamalytics).toBe('unconfigured')
              const raw = await readFile(file(), 'utf8')
              expect(raw).not.toContain('ApiKey')
              expect(second.result('profile', 'Node', 'b'.repeat(64), 86400000)).toBeUndefined()
            } finally { await rm(dir, { recursive: true, force: true }) }
          })
          ''').lstrip('\n'))

          Path('docs').mkdir(exist_ok=True)
          Path('docs/ip-purity-beta4.md').write_text(dedent('''
          # IP purity Beta 4

          Four optional/available sources; user-supplied keys enable AbuseIPDB and ipapi.is.
          AbuseIPDB uses GET /api/v2/check with a Key header and maxAgeInDays=90; no report/write endpoints.
          ipapi.is uses POST JSON {q, key}; credentials are not in URLs.
          Providers fail independently; missing sources are not zero-risk sources. Status enums only are cached.

          ## Experimental scoring v2

          Weights: AbuseIPDB 40, Scamalytics 25, proxycheck.io 20, ipapi.is 15.
          Normalize by the sum of weights of sources with valid score evidence. Show coverage separately;
          it is neither confidence nor accuracy. Only proxy attributes are labelled limited evidence.
          Score = round(100 - max(weighted risk, severe-signal risk floor)).

          proxycheck.io raw scores are always visible. Proxy-only risk is capped at 25;
          VPN at its documented 50 baseline maps to 15; hosting at its 33 baseline maps to 10.
          Above those VPN/hosting baselines risk increases continuously up to 100. Tor is at least 60;
          compromised is at least 90. Proxy risk 100 alone cannot separate proxy use from abuse;
          bounding it is an explicit heuristic, not removal of proven abuse.

          ipapi.is has no per-IP fraud score: the client maps is_abuser to 80, Tor 60,
          Proxy 25, VPN 15, datacenter 10, taking the highest in that order. An explicit
          is_abuser=false can yield zero if no positive attribute exists; unknown data cannot.
          Company and ASN abuser_score are NOT included in the formula.

          Floors prevent averaging away serious evidence: AbuseIPDB >=75 sets that risk as the
          minimum; proxycheck Compromised sets 90; ipapi.is is_abuser sets 60;
          Scamalytics >=90 sets 75. These are client policy choices, not vendor guarantees.

          ## Examples

          VPN-only proxycheck raw 50 => score 85 (limited evidence).
          Proxy-only raw 100 => score 75 (limited evidence), not zero.
          AbuseIPDB 0 plus Proxy-only raw 100 => weighted risk 8.333 => score 92.
          AbuseIPDB 95 plus three low sources => score at most 5 due to the evidence floor.

          ## Cache and credentials

          Three-worker concurrency, IP deduplication, explicit refresh and disk persistence remain.
          The source fingerprint includes the scoring version and added keys so old scores cannot
          be reused under a new policy. Refresh once after upgrading. API keys are in config.yaml
          and included in WebDAV backup, not in the cache. The cache is local-only as before.

          ## Provider documentation

          https://docs.abuseipdb.com/#check-endpoint
          https://ipapi.is/developers.html
          https://proxycheck.io/api/
          ''').lstrip('\n'))
          PY
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Format touched source
        run: |
          pnpm exec prettier --write src/shared/ipPurity.d.ts src/shared/ipPurityScore.ts src/main/core/ipPurity.ts src/main/core/ipPurityCache.ts src/main/core/ipPurityProviders.ts src/main/core/ipPurityProviders.test.ts src/main/core/ipPurityScore.test.ts src/main/core/ipPurityExtendedCache.test.ts src/main/core/ipPurity.test.ts src/renderer/src/components/proxies/purity-details.tsx src/renderer/src/components/proxies/proxy-item.tsx src/renderer/src/components/settings/purity-provider-settings.tsx src/renderer/src/components/settings/mihomo-config.tsx src/renderer/src/locales/*.json docs/ip-purity-beta4.md
      - name: Validate all code
        run: |
          pnpm run format:check
          pnpm run lint:check
          pnpm run typecheck
          pnpm test
      - name: Commit validated changes to feature branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'YaKun9/clash-party'
          test "$GITHUB_REF" = 'refs/heads/feature/ip-purity'
          rm .github/workflows/prepare-ip-purity-beta4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shared/ipPurity.d.ts src/shared/ipPurityScore.ts src/main/core/ipPurity*.ts src/renderer/src/components/proxies/purity-details.tsx src/renderer/src/components/proxies/proxy-item.tsx src/renderer/src/components/settings/purity-provider-settings.tsx src/renderer/src/components/settings/mihomo-config.tsx src/renderer/src/locales/*.json docs/ip-purity-beta4.md .github/workflows/prepare-ip-purity-beta4.yml
          git -c core.hooksPath=/dev/null commit -m 'feat: integrate rich IP hover card and four-source weighted scoring'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push origin HEAD:refs/heads/feature/ip-purity
