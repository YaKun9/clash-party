name: Prepare IP Purity Beta 3

on:
  push:
    branches: [feature/ip-purity]
    paths: ['.github/workflows/prepare-ip-purity-beta3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  implement:
    if: github.repository == 'YaKun9/clash-party' && github.ref == 'refs/heads/feature/ip-purity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Apply persistent-cache integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one edit location: {path}: {old[:100]}')
              p.write_text(text.replace(old, new, 1))

          def put(path, text):
              Path(path).write_text(dedent(text).lstrip('\n'))

          p = Path('src/main/core/ipPurity.ts')
          text = p.read_text()
          text = text.replace("import { getAppConfig } from '../config'", "import { getAppConfig, getProfileConfig } from '../config'\nimport { createHash } from 'crypto'\nimport { join } from 'path'\nimport { dataDir } from '../utils/dirs'\nimport { IpPurityCache, canonicalExitIp, ipPurityCacheMs, type IpPurityRecord } from './ipPurityCache'")
          start = text.index('interface CachedPurity')
          end = text.index('function buildScamalyticsUrl', start)
          text = text[:start] + dedent('''
