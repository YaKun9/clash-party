name: Finish IP Purity Beta 4
on:
  push:
    branches: [feature/ip-purity]
    paths: ['.github/workflows/finish-ip-purity-beta4.yml']
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'YaKun9/clash-party' && github.ref == 'refs/heads/feature/ip-purity'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Reapply the exact previously validated integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import subprocess
          path = '.github/workflows/prepare-ip-purity-beta4.yml'
          actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          if actual != '9335c6ef569138ea322008992478cb969c2466db':
              raise RuntimeError('The reviewed integration script has changed')
          text = Path(path).read_text()
          start = text.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = text.index('\n          PY\n', start)
          subprocess.run(['python3', '-c', dedent(text[start:end])], check=True)
          PY
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Format changed source
        run: |
          pnpm exec prettier --write src/shared/ipPurity.d.ts src/shared/ipPurityScore.ts src/main/core/ipPurity.ts src/main/core/ipPurityCache.ts src/main/core/ipPurityProviders.ts src/main/core/ipPurityProviders.test.ts src/main/core/ipPurityScore.test.ts src/main/core/ipPurityExtendedCache.test.ts src/main/core/ipPurity.test.ts src/renderer/src/components/proxies/purity-details.tsx src/renderer/src/components/proxies/proxy-item.tsx src/renderer/src/components/settings/purity-provider-settings.tsx src/renderer/src/components/settings/mihomo-config.tsx src/renderer/src/locales/*.json docs/ip-purity-beta4.md
      - name: Validate all source
        run: |
          pnpm run format:check
          pnpm run lint:check
          pnpm run typecheck
          pnpm test
      - name: Commit and push to the feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'YaKun9/clash-party'
          test "$GITHUB_REF" = 'refs/heads/feature/ip-purity'
          rm .github/workflows/prepare-ip-purity-beta4.yml .github/workflows/finish-ip-purity-beta4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shared/ipPurity.d.ts src/shared/ipPurityScore.ts src/main/core/ipPurity*.ts src/renderer/src/components/proxies/purity-details.tsx src/renderer/src/components/proxies/proxy-item.tsx src/renderer/src/components/settings/purity-provider-settings.tsx src/renderer/src/components/settings/mihomo-config.tsx src/renderer/src/locales/*.json docs/ip-purity-beta4.md .github/workflows/prepare-ip-purity-beta4.yml .github/workflows/finish-ip-purity-beta4.yml
          git -c core.hooksPath=/dev/null commit -m 'feat: integrate rich IP hover card and four-source weighted scoring'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feature/ip-purity
