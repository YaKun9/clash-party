name: Prepare IP Purity Beta 2

on:
  push:
    branches: [feature/ip-purity]
    paths: ['.github/workflows/prepare-ip-purity-beta2.yml']

permissions:
  contents: read

jobs:
  implement:
    if: github.repository == 'YaKun9/clash-party'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Apply reviewed source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def put(path, text):
              Path(path).write_text(dedent(text).lstrip('\n'), encoding='utf-8')

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one reviewed edit location: {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          put('src/main/core/ipPurityPool.ts', '''
          // A worker owns its selector until the complete probe/query task settles.
          // Never release a slot just because its result cache was cleared.
          export class IpPurityPool {
            private readonly available: number[]
            private readonly queue: Array<(slot: number) => void> = []

            constructor(size: number) {
              if (!Number.isInteger(size) || size < 1) throw new Error('Invalid IP purity pool size')
              this.available = Array.from({ length: size }, (_, index) => index)
            }

            run<T>(task: (slot: number) => Promise<T>): Promise<T> {
              return new Promise<T>((resolve, reject) => {
                this.queue.push((slot) => {
                  void Promise.resolve()
                    .then(() => task(slot))
                    .then(
                      (value) => {
                        this.available.push(slot)
                        this.drain()
                        resolve(value)
                      },
                      (error: unknown) => {
                        this.available.push(slot)
                        this.drain()
                        reject(error)
                      }
                    )
                })
                this.drain()
              })
            }

            private drain(): void {
              while (this.available.length > 0 && this.queue.length > 0) {
                const slot = this.available.shift()!
                const start = this.queue.shift()!
                start(slot)
              }
            }
          }
          ''')

          put('src/main/core/ipPurityRuntime.ts', '''
          import { createServer, type Server } from 'net'

          export const IP_PURITY_CONCURRENCY = 3
          export const IP_PURITY_GROUP_NAME = '__clash_party_internal_ip_purity__'
          export const IP_PURITY_LISTENER_NAME = '__clash_party_internal_ip_purity_listener__'

          export function ipPurityGroupName(slot: number): string {
            return slot === 0 ? IP_PURITY_GROUP_NAME : `${IP_PURITY_GROUP_NAME}${slot}`
          }

          function listenerName(slot: number): string {
            return slot === 0 ? IP_PURITY_LISTENER_NAME : `${IP_PURITY_LISTENER_NAME}${slot}`
          }

          const slots = Array.from({ length: IP_PURITY_CONCURRENCY }, (_, index) => index)
          const groupNames = new Set(slots.map(ipPurityGroupName))
          const listenerNames = new Set(slots.map(listenerName))
          let portsPromise: Promise<number[]> | null = null

          export function isIpPurityGroup(name: string): boolean {
            return groupNames.has(name)
          }

          async function allocatePorts(): Promise<number[]> {
            const servers: Server[] = []
            try {
              const ports: number[] = []
              // Keep earlier sockets open until all ports have been allocated, so
              // the OS cannot hand the same ephemeral port to two workers.
              for (const _slot of slots) {
                const server = createServer()
                server.unref()
                servers.push(server)
                ports.push(await new Promise<number>((resolve, reject) => {
                  server.once('error', reject)
                  server.listen(0, '127.0.0.1', () => {
                    const address = server.address()
                    if (!address || typeof address === 'string') {
                      reject(new Error('Failed to allocate IP purity listener port'))
                      return
                    }
                    resolve(address.port)
                  })
                }))
              }
              return ports
            } finally {
              await Promise.all(servers.map((server) => new Promise<void>((resolve) => {
                server.close(() => resolve())
              })))
            }
          }

          export async function ensureIpPurityPort(slot = 0): Promise<number> {
            if (!Number.isInteger(slot) || slot < 0 || slot >= IP_PURITY_CONCURRENCY) {
              throw new Error('Invalid IP purity worker slot')
            }
            if (!portsPromise) {
              portsPromise = allocatePorts().catch((error) => {
                portsPromise = null
                throw error
              })
            }
            return (await portsPromise)[slot]
          }

          export async function injectIpPurityRuntime(profile: IMihomoConfig, enabled: boolean): Promise<void> {
            const runtime = profile as unknown as {
              'proxy-groups'?: Record<string, unknown>[]
              listeners?: Record<string, unknown>[]
            }
            const groups = Array.isArray(runtime['proxy-groups']) ? runtime['proxy-groups'] : []
            const listeners = Array.isArray(runtime.listeners) ? runtime.listeners : []
            runtime['proxy-groups'] = groups.filter((group) => !groupNames.has(String(group?.name)))
            runtime.listeners = listeners.filter((listener) => !listenerNames.has(String(listener?.name)))
            if (!enabled) return

            const ports = await Promise.all(slots.map(ensureIpPurityPort))
            for (const slot of slots) {
              runtime['proxy-groups'].push({
                name: ipPurityGroupName(slot),
                type: 'select',
                'include-all': true,
                hidden: true
              })
              runtime.listeners.push({
                name: listenerName(slot),
                type: 'mixed',
                port: ports[slot],
                listen: '127.0.0.1',
                proxy: ipPurityGroupName(slot),
                udp: false,
                users: []
              })
            }
          }
          ''')

          factory = Path('src/main/core/factory.ts')
          text = factory.read_text(encoding='utf-8')
          start = text.index('async function injectIpPurityRuntime(')
          end = text.index('export async function globalOverrideIdsNow()', start)
          text = text[:start] + text[end:]
          old = "import {\n  ensureIpPurityPort,\n  IP_PURITY_GROUP_NAME,\n  IP_PURITY_LISTENER_NAME\n} from './ipPurityRuntime'"
          assert text.count(old) == 1
          text = text.replace(old, "import { injectIpPurityRuntime } from './ipPurityRuntime'")
          factory.write_text(text, encoding='utf-8')

          replace('src/main/core/mihomoApi.ts',
                  "import { IP_PURITY_GROUP_NAME } from './ipPurityRuntime'",
                  "import { isIpPurityGroup } from './ipPurityRuntime'")
          replace('src/main/core/mihomoApi.ts',
                  '.filter((name) => name !== IP_PURITY_GROUP_NAME)',
                  '.filter((name) => !isIpPurityGroup(name))')

          file = Path('src/main/core/ipPurity.ts')
          text = file.read_text(encoding='utf-8')
          old = "import { ensureIpPurityPort, IP_PURITY_GROUP_NAME } from './ipPurityRuntime'"
          assert text.count(old) == 1
          text = text.replace(old, "import { ensureIpPurityPort, ipPurityGroupName, IP_PURITY_CONCURRENCY } from './ipPurityRuntime'\nimport { IpPurityPool } from './ipPurityPool'")
          start = text.index('// Purity checks share one hidden selector/listener')
          end = text.index('function buildScamalyticsUrl', start)
          text = text[:start] + "const purityPool = new IpPurityPool(IP_PURITY_CONCURRENCY)\nconst providerRequests = new Map<string, ReturnType<typeof performProviderQuery>>()\n\n" + text[end:]
          edits = [
              ('async function discoverExitIp(proxy: string): Promise<string>', 'async function discoverExitIp(proxy: string, slot: number): Promise<string>'),
              ('const port = await ensureIpPurityPort()', 'const port = await ensureIpPurityPort(slot)'),
              ('encodeURIComponent(IP_PURITY_GROUP_NAME)', 'encodeURIComponent(ipPurityGroupName(slot))'),
              ('async function queryProviders(', 'async function performProviderQuery('),
              ('async function checkProxyPurity(proxy: string, generation: number): Promise<IProxyPurityResult>', 'async function checkProxyPurity(proxy: string, generation: number, slot: number): Promise<IProxyPurityResult>'),
              ('const ip = await discoverExitIp(proxy)', 'const ip = await discoverExitIp(proxy, slot)'),
              ('const run = enqueue(() => checkProxyPurity(proxy, generation))', 'const run = purityPool.run((slot) => checkProxyPurity(proxy, generation, slot))')
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise RuntimeError(f'Unexpected purity implementation: {old}')
              text = text.replace(old, new, 1)
          marker = 'async function checkProxyPurity('
          wrapper = '''
          // Simultaneous nodes with the same exit IP share one in-flight lookup.
          // Include the cache generation so clearing/retrying cannot reuse an old request.
          function queryProviders(ip: string, cacheMs: number, generation: number): ReturnType<typeof performProviderQuery> {
            const key = `${generation}:${ip}`
            const pending = providerRequests.get(key)
            if (pending) return pending
            const request = performProviderQuery(ip, cacheMs, generation).finally(() => {
              if (providerRequests.get(key) === request) providerRequests.delete(key)
            })
            providerRequests.set(key, request)
            return request
          }

          '''
          text = text.replace(marker, dedent(wrapper).lstrip('\n') + marker, 1)
          file.write_text(text, encoding='utf-8')

          replace('src/renderer/src/pages/proxies.tsx',
                  "      for (const proxy of proxies) {\n        if (!('all' in proxy)) {\n          await onProxyPurity(proxy)\n        }\n      }",
                  "      // Queue all nodes; the main process limits concurrency across every group.\n      await Promise.allSettled(\n        proxies.filter((proxy) => !('all' in proxy)).map((proxy) => onProxyPurity(proxy))\n      )")

          replace('src/main/core/ipPurity.test.ts',
                  "  ensureIpPurityPort: async () => 17990,\n  IP_PURITY_GROUP_NAME: 'test-purity'",
                  "  ensureIpPurityPort: async (slot: number) => 17990 + slot,\n  ipPurityGroupName: (slot: number) => `test-purity-${slot}`,\n  IP_PURITY_CONCURRENCY: 3")

          with Path('src/main/core/ipPurity.test.ts').open('a', encoding='utf-8') as stream:
              stream.write(dedent('''

          describe('isolated bounded concurrency', () => {
            it('runs three different exits concurrently and queues the fourth without mixing routes', async () => {
              const selected = new Map<number, string>()
              const ipFor = { A: '203.0.113.1', B: '203.0.113.2', C: '203.0.113.3', D: '203.0.113.4' }
              const firstThreeStarted = deferred<void>()
              const release = deferred<void>()
              const ports = new Set<number>()
              let probes = 0
              mocks.put.mockImplementation(async (url: string, body: { name: string }) => {
                const slot = Number(url.slice(-1))
                selected.set(17990 + slot, body.name)
              })
              mocks.httpGet.mockImplementation(async (url: string, options?: { proxy?: { port: number } }) => {
                if (url.includes('ipify.org')) {
                  const port = options!.proxy!.port
                  ports.add(port)
                  const node = selected.get(port) as keyof typeof ipFor
                  probes++
                  if (probes === 3) firstThreeStarted.resolve()
                  await release.promise
                  // No other task may change this selector while this probe is active.
                  expect(selected.get(port)).toBe(node)
                  return { data: { ip: ipFor[node] } }
                }
                const ip = decodeURIComponent(url.split('/').pop()!)
                return { data: { [ip]: { detections: { risk: 10 } } } }
              })
              const requests = ['A', 'B', 'C', 'D'].map(mihomoProxyPurity)
              await firstThreeStarted.promise
              expect(probes).toBe(3)
              expect(mocks.put).toHaveBeenCalledTimes(3)
              expect(ports.size).toBe(3)
              expect((await getProxyPurityState()).checking).toHaveLength(4)
              release.resolve()
              const results = await Promise.all(requests)
              expect(results.map((result) => result.ip)).toEqual(Object.values(ipFor))
              expect(mocks.put).toHaveBeenCalledTimes(4)
              expect((await getProxyPurityState()).checking).toEqual([])
            })

            it('deduplicates simultaneous provider requests for a shared exit IP', async () => {
              const lookup = deferred<typeof providerResponse>()
              const started = deferred<void>()
              let lookups = 0
              mocks.httpGet.mockImplementation(async (url: string) => {
                if (url.includes('ipify.org')) return { data: { ip: IP } }
                lookups++
                started.resolve()
                return lookup.promise
              })
              const requests = ['A', 'B', 'C'].map(mihomoProxyPurity)
              await started.promise
              for (let index = 0; index < 30; index++) await Promise.resolve()
              expect(lookups).toBe(1)
              expect(mocks.httpGet).toHaveBeenCalledTimes(4)
              lookup.resolve(providerResponse)
              const results = await Promise.all(requests)
              expect(results.map((result) => result.score)).toEqual([90, 90, 90])
            })
          })
          '''))

          put('src/main/core/ipPurityPool.test.ts', '''
          import { describe, expect, it } from 'vitest'
          import { IpPurityPool } from './ipPurityPool'
          import { ensureIpPurityPort, injectIpPurityRuntime, isIpPurityGroup, ipPurityGroupName } from './ipPurityRuntime'

          describe('IP purity worker pool and runtime', () => {
            it('releases a slot after a synchronous failure', async () => {
              const pool = new IpPurityPool(1)
              await expect(pool.run(() => { throw new Error('failed') })).rejects.toThrow('failed')
              expect(await pool.run(async (slot) => slot)).toBe(0)
            })

            it('allocates distinct reusable loopback ports', async () => {
              const ports = await Promise.all([0, 1, 2].map(ensureIpPurityPort))
              expect(new Set(ports).size).toBe(3)
              expect(await ensureIpPurityPort(1)).toBe(ports[1])
              await expect(ensureIpPurityPort(3)).rejects.toThrow('Invalid')
            })

            it('injects three isolated listeners without duplicating or replacing user groups', async () => {
              const profile = { 'proxy-groups': [{ name: 'User choice', type: 'select' }], listeners: [] } as unknown as IMihomoConfig
              await injectIpPurityRuntime(profile, true)
              await injectIpPurityRuntime(profile, true)
              const config = profile as unknown as { 'proxy-groups': { name: string }[]; listeners: { listen: string; port: number; proxy: string }[] }
              expect(config['proxy-groups'].map((group) => group.name)).toEqual(['User choice', ...[0, 1, 2].map(ipPurityGroupName)])
              expect(config.listeners).toHaveLength(3)
              expect(config.listeners.every((listener) => listener.listen === '127.0.0.1')).toBe(true)
              expect(new Set(config.listeners.map((listener) => listener.port)).size).toBe(3)
              expect(config.listeners.every((listener) => isIpPurityGroup(listener.proxy))).toBe(true)
              await injectIpPurityRuntime(profile, false)
              expect(config['proxy-groups']).toEqual([{ name: 'User choice', type: 'select' }])
              expect(config.listeners).toEqual([])
            })
          })
          ''')

          # This is a one-shot editing workflow; the resulting source commit contains
          # the implementation and tests, not an ongoing auto-commit workflow.
          Path('.github/workflows/prepare-ip-purity-beta2.yml').unlink()
          PY
      - run: pnpm install --ignore-scripts --frozen-lockfile
      - name: Format edited source
        run: |
          pnpm exec prettier --write src/main/core/ipPurity*.ts src/main/core/factory.ts src/main/core/mihomoApi.ts src/renderer/src/pages/proxies.tsx
      - name: Validate source
        run: |
          pnpm run review
          pnpm test
      - name: Commit validated source to feature branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actual=$(gh api repos/YaKun9/clash-party/git/ref/heads/feature/ip-purity --jq .object.sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Feature branch changed; refusing to overwrite'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/core src/renderer/src/pages/proxies.tsx .github/workflows/prepare-ip-purity-beta2.yml
          git -c core.hooksPath=/dev/null commit -m 'feat: isolate three concurrent IP purity workers and deduplicate provider requests'
          gh auth setup-git
          git push origin HEAD:refs/heads/feature/ip-purity
          echo "Validated source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
